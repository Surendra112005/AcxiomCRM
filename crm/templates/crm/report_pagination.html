{% if objects.has_other_pages %}<nav class="mt-3" aria-label="Report pages"><ul class="pagination">{% if objects.has_previous %}<li class="page-item"><a class="page-link" href="?page={{objects.previous_page_number}}&q={{filters.q|urlencode}}&date_from={{filters.date_from}}&date_to={{filters.date_to}}&status={{filters.status|urlencode}}&stage={{filters.stage|urlencode}}&source={{filters.source|urlencode}}&user={{filters.user}}">Previous</a></li>{% endif %}<li class="page-item disabled"><span class="page-link">Page {{objects.number}} of {{objects.paginator.num_pages}}</span></li>{% if objects.has_next %}<li class="page-item"><a class="page-link" href="?page={{objects.next_page_number}}&q={{filters.q|urlencode}}&date_from={{filters.date_from}}&date_to={{filters.date_to}}&status={{filters.status|urlencode}}&stage={{filters.stage|urlencode}}&source={{filters.source|urlencode}}&user={{filters.user}}">Next</a></li>{% endif %}</ul></nav>{% endif %}
